

<div class="min-w-60">
    <h1 class="text-2xl font-bold">Filters</h1>


    <!-- Category filter -->
    @if(this.isLoading()){
        <div>
            <h1>Loading...</h1>
        </div>
    } @else if (!this.isLoading() && this.errorMessage() == "" ) {
        <div>
            <h1 class="font-bold">Categories</h1>
            <div class="flex flex-col">
                @for (item of this.categoriesList().data; track $index) {
                <div>
                    <input 
                     type="checkbox"
                     id="'category-' + item.id"
                     [checked]="this.isSelected(item.id)"
                     (change)="onCategoryChange($event, item.id)"
                      /><label for="'category-' + item.id" class="text-black"> {{item.name}} </label>
                </div>
            }
            </div>
        </div>
    }


    <!-- Min and Max Value in filter -->
    <div class="my-2">
        <h1 class="font-bold my-2">Price Range</h1>
        <div>
           <div class="mb-2">
            <label for="minPrice"> Min price </label> 
            <input 
                type="number" 
                class="border-2 w-20 rounded-xl pl-2"
                id="minPrice"
                (input)="getMinInputValue($event)"
            /></div>
          <div>
            <label for="maxPrice"> Max price </label> 
            <input 
                type="number" 
                id="maxPrice"
                class="border-2 w-20 rounded-xl pl-2"
                (input)="getMaxInputValue($event)"
            /></div>
        </div>
    </div>

    <!-- Rating section -->
    <div>
        <h1 class="font-bold">Ratings</h1>
        <div class="flex flex-col"> 
            @for (item of ratingsList; track item.value) {
                <div class="flex items-center gap-2">
                    <input type="radio" 
                        name="ratingFilter"
                        id="checkButton"
                        [value]= "item.value"
                        (change)="onRatingChange(item.value)"
                    />
                    <!-- star icon -->
                    <svg class="w-5 h-5 text-yellow-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M13.849 4.22c-.684-1.626-3.014-1.626-3.698 0L8.397 8.387l-4.552.361c-1.775.14-2.495 2.331-1.142 3.477l3.468 2.937-1.06 4.392c-.413 1.713 1.472 3.067 2.992 2.149L12 19.35l3.897 2.354c1.52.918 3.405-.436 2.992-2.15l-1.06-4.39 3.468-2.938c1.353-1.146.633-3.336-1.142-3.477l-4.552-.36-1.754-4.17Z"/>
                    </svg>
                    <label for="checkButton"> {{item.value}} Star </label> 
                </div>
            }
        </div>
    </div>

</div>
